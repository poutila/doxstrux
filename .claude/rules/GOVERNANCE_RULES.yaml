      - refine_process: "Adjust based on team feedback"

# =============================================================================
# FACTS BEFORE FILES (FDP Integration)
# =============================================================================

facts_before_files:
  description: "When to query facts vs reading files directly"
  severity: NOTE
  
  prefer_facts_for:
    - code_structure: "Classes, functions, signatures, complexity"
    - dependencies: "Imports, call graphs, coupling"
    - metrics: "LOC, cyclomatic complexity, test coverage"
    - patterns: "Naming conventions, error handling patterns"
  
  prefer_files_for:
    - implementation_details: "Specific algorithm logic"
    - documentation: "Docstrings, comments"
    - literals: "Specific error messages, constants"
    - context: "Why decisions were made (git history)"
  
  decision_tree:
    question: "What do I need to know?"
    branches:
      structural_info:
        questions:
          - "How many X exist?"
          - "What are signatures of Y?"
          - "What calls Z?"
        decision: "USE fact query (faster, more accurate)"

      implementation_logic:
        questions:
          - "How does X implement Y?"
          - "What's the algorithm for Z?"
          - "What are exact error messages?"
        decision: "READ file (need full context)"
      
      unsure:
        decision: |
          1. Try fact query first (might be sufficient)
          2. If insufficient → read file
          3. If repeatedly reading → consider adding to fact schema

# =============================================================================
# IMPORT GOVERNANCE
# =============================================================================

import_governance:
  
  import_style:
    severity: ERROR
    
    relative_imports_within_package:
      description: "Use relative imports for intra-package references"
      severity: ERROR
      rule: "Always use relative imports when importing from the same package"
      rationale: |
        Relative imports make code more portable and refactorable.
        They clearly indicate package-internal dependencies vs external ones.
      
      examples:
        correct:
          - description: "Import from sibling module"
            code: "from .utils import helper_function"
            location: "mypackage/submodule/module.py"
          
          - description: "Import from parent package"
            code: "from ..core import BaseClass"
            location: "mypackage/submodule/module.py"
          
          - description: "Import from sibling subpackage"
            code: "from ..other_submodule import helper"
            location: "mypackage/submodule/module.py"
          
          - description: "Import from deeper submodule"
            code: "from .validators.schema import validate_config"
            location: "mypackage/module.py"
        
        incorrect:
          - description: "Absolute import to own package"
            bad_code: "from mypackage.utils import helper_function"
            correct_code: "from .utils import helper_function"
            reason: "Should use relative import within same package"
            location: "mypackage/submodule/module.py"
          
          - description: "Absolute import to parent package module"
            bad_code: "from mypackage.core import BaseClass"
            correct_code: "from ..core import BaseClass"
            reason: "Should use relative import for intra-package reference"
            location: "mypackage/submodule/module.py"
      
      enforcement:
        automated: "ruff check --select TID252"  # ban-relative-imports OFF, prefer relative
        manual: "Code review checks for absolute imports to own package"
    
    absolute_imports_for_external:
      description: "Use absolute imports for external dependencies"
      severity: ERROR
      rule: "Always use absolute imports for stdlib and third-party packages"
      
      examples:
        correct:
          - "import os"
          - "from pathlib import Path"
          - "from typing import Dict, List"
          - "import pandas as pd"
          - "from pydantic import BaseModel"
        
        incorrect:
          - bad_code: "from . import os"  # Never relative for stdlib
            correct_code: "import os"
          - bad_code: "from ..typing import Dict"  # Never relative for stdlib
            correct_code: "from typing import Dict"
    
    general_rules:
      - no_star_imports: "from module import *"
      - explicit_imports_preferred: "from x import y, z"
      - alphabetize_imports: "Use ruff/isort"
    
  import_organization:
    order:
      - stdlib
      - third_party
      - first_party  # Absolute imports to other internal packages
      - local  # Relative imports (same package)
    separator: blank_line_between_groups
    
    example_structure: |
      # Standard library
      import os
      from pathlib import Path
      from typing import Dict, List
      
      # Third-party
      import pandas as pd
      from pydantic import BaseModel
      
      # First-party (other packages in monorepo)
      from other_internal_package import something
      
      # Local (same package, use relative)
      from .utils import helper
      from ..core import BaseClass
      from .validators.schema import validate_config
  
  module_import_purity:
    severity: ERROR
    forbidden:
      - side_effects_on_import: "No module-level execution of business logic"
      - circular_imports: "Indicates design problem"
      - dynamic_path_manipulation: "sys.path.append forbidden"
      - absolute_imports_to_own_package: "Use relative imports within same package"
    allowed:
      - logger_configuration: "If purely declarative"
      - constants_definition: "Module-level constants OK"
      - class_decorator_application: "If no side effects"
    
  migration_guide:
    description: "How to refactor from absolute to relative imports"
    steps:
      - step: 1
        action: "Identify package structure"
        command: "find src/ -name '__init__.py' | xargs dirname"
        purpose: "Map out package hierarchy"
      
      - step: 2
        action: "Find absolute imports to own package"
        command: "grep -r 'from mypackage' src/mypackage/ --include='*.py'"
        purpose: "Locate imports that should be relative"
      
      - step: 3
        action: "Calculate relative import path"
        method: |
          From: src/mypackage/submodule/file.py
          Import: from mypackage.utils import helper
          
          Calculation:
          - Current location: mypackage/submodule/
          - Target location: mypackage/utils
          - Relative path: ../utils
          - Result: from ..utils import helper
      
      - step: 4
        action: "Apply transformation"
        examples:
          same_level: "from mypackage.x import y → from .x import y"
          parent_level: "from mypackage.x import y → from ..x import y (if in subpackage)"
          nested: "from mypackage.a.b import y → from .a.b import y"
      
      - step: 5
        action: "Verify with ruff"
        command: "ruff check --select TID --fix"
        purpose: "Auto-fix and validate import organization"
    
    exceptions:
      __init__py_reexports:
        description: "Package __init__.py may use absolute imports for re-exports"
        allowed: true
        example: |
          # In src/mypackage/__init__.py
          from mypackage.core import BaseClass  # OK for re-export
          __all__ = ['BaseClass']
        rationale: "Public API definition, not internal usage"
      
      __main__py:
        description: "Entry point files may use absolute imports"
        allowed: true
        example: |
          # In src/mypackage/__main__.py
          from mypackage.cli import main  # OK
          if __name__ == '__main__':
              main()
        rationale: "Entry points are special, not typical package modules"

# =============================================================================
# DOCUMENTATION
# =============================================================================

documentation:
  
  docstring_standards:
    severity: WARNING
    required_for:
      - public_functions
      - public_classes
      - public_methods
      - complex_algorithms
    
    format: google_style  # or numpy_style
    
    must_include:
      - description: "What it does"
      - args: "Parameters with types and meaning"
      - returns: "Return value with type"
      - raises: "Exceptions that may be raised"
    
    optional_but_recommended:
      - examples: "Usage examples for complex APIs"
      - notes: "Important caveats or gotchas"
      - see_also: "Related functions"
  
  inline_comments:
    severity: NOTE
    when_to_use:
      - complex_logic: "Algorithm explanation"
      - workarounds: "Why unusual approach taken"
      - gotchas: "Non-obvious behavior"
    when_not_to_use:
      - obvious_code: "# Increment counter (for i += 1)"
      - redundant: "Repeat what code says"
  
  architectural_docs:
    severity: WARNING
    required:
      - readme: "Project overview, setup, usage"
      - architecture_decision_records: "For major decisions"
      - api_reference: "For public libraries"
    recommended:
      - contributing_guide: "For open source"
      - changelog: "Track user-facing changes"

# =============================================================================
# LOGGING AND OBSERVABILITY
# =============================================================================

logging_governance:
  
  log_levels:
    severity: WARNING
    standards:
      DEBUG:
        use_for: "Detailed diagnostic info"
        examples: ["Variable values", "Loop iterations", "Internal state"]
      INFO:
        use_for: "General informational messages"
        examples: ["Service started", "Request received", "Task completed"]
      WARNING:
        use_for: "Recoverable issues"
        examples: ["Deprecated API used", "Retry attempted", "Fallback activated"]
      ERROR:
        use_for: "Failures requiring attention"
        examples: ["Request failed", "Resource unavailable", "Data corruption"]
      CRITICAL:
        use_for: "System-level failures"
        examples: ["Service down", "Data loss", "Security breach"]
  
  logging_practices:
    severity: WARNING
    required:
      - structured_logging: "Use JSON or key-value pairs"
      - context_preservation: "Include request ID, user ID, etc."
      - no_sensitive_data: "No passwords, tokens, PII"
      - actionable_messages: "What went wrong + what to do"
    
    forbidden:
      - print_statements: "Use logger instead"
      - log_and_raise: "Choose log OR raise, not both"
      - generic_messages: "'Error occurred' without context"

# =============================================================================
# FACTS BEFORE FILES (CONTINUED)
# =============================================================================

facts_query_patterns:
  description: "Query facts (FACTS.parquet) before reading files"
  severity: NOTE
  recommended: true
  
  when_facts_sufficient:
    - entity_discovery: "What modules/classes/functions exist?"
    - signature_lookup: "What are function signatures?"
    - dependency_analysis: "What imports what?"
    - complexity_metrics: "Cyclomatic complexity, LOC"
    - call_graph: "What calls what?"
  
  when_files_needed:
    - algorithm_details: "How is calculation performed?"
    - error_messages: "Exact wording of exceptions"
    - comments: "Why was it done this way?"
    - control_flow_logic: "Detailed if/else/loop structure"
  
  workflow:
    step_1: "Query FACTS.parquet for structural info"
    step_2: "If insufficient → read specific files"
    step_3: "If pattern repeats → enhance fact extraction"

# =============================================================================
# ENFORCEMENT & CI
# =============================================================================

enforcement:
  
  ci_gates:
    - all_tests_pass
    - type_checking_passes
    - linters_pass
    - no_todos_in_src
    - facts_are_fresh
  
  pr_checklist:
    yagni_enforcement:
      - id: PR_CHECK_REQ_ID
        text: "Current requirement ID is referenced"
        severity: blocker
        automated: false
      - id: PR_CHECK_IMMEDIATE_USE
        text: "Feature is used immediately by at least one code path"
        severity: blocker
        automated: false
      - id: PR_CHECK_NO_SPECULATIVE
        text: "No speculative flags, hooks, or abstractions added"
        severity: blocker
        automated: false
    
    solid_enforcement:
      - id: PR_CHECK_REAL_CONSUMERS
        text: "Generalizations have ≥2 real consumers today"
        severity: warning
        automated: false
    
    tdd_enforcement:
      - id: PR_CHECK_TESTS
        text: "Tests prove current necessity (fail-before, pass-after)"
        severity: blocker
        automated: true
    
    kiss_enforcement:
      - id: PR_CHECK_KISS
        text: "Simpler alternative considered and documented"
        severity: blocker
        automated: false
    
    fdp_enforcement:
      - id: PR_CHECK_NO_PROBABLY
        text: "No probabilistic language without evidence"
        severity: warning
        automated: true
        check: "grep -rn '\\b(probably|seems|appears to)\\b' src/"
      - id: PR_CHECK_VERIFIABLE
        text: "Major decisions have verification commands"
        severity: warning
        automated: false
  
  waiver_policy:
    description: "Formal process for temporary exceptions to governance rules"
    required_fields:
      - ticket_id
      - approver
      - expires_at
      - justification
      - risk_assessment
    constraints:
      max_duration_days: 30
      auto_expire: true
    approval_levels:
      blocker: tech_lead
      warning: senior_dev
      note: peer_review
    tracking:
      waiver_log: waivers.jsonl
      metrics:
        - total_waivers
        - expired_waivers
        - violation_types
        - waiver_usage_rate
  
  code_review_checklist:
    weak_tests_identified: true
    magic_numbers_eliminated: true
    silent_fallbacks_removed: true
    error_messages_actionable: true
    type_hints_present: true
    simpler_alternatives_documented: true
    yagni_violations_caught: true
    unverified_claims_flagged: true  # FDP addition
    probabilistic_language_removed: true  # FDP addition
  
  automated_checks:
    ruff:
      - import_style
      - complexity_limits
      - naming_conventions
    mypy:
      - type_coverage
      - strict_mode
    pytest:
      - test_coverage
      - no_weak_tests
    ripgrep:
      - no_todos
      - no_legacy_fields
      - no_magic_strings
      - no_probabilistic_language  # FDP addition
    custom_fdp_checks:
      - check_for_assumptions: "grep -rn 'ASSUMPTION:' src/ | wc -l"
      - check_for_probably: "grep -rn '\\bprobably\\b' src/ --include='*.py'"
      - check_for_seems: "grep -rn '\\bseems\\b' src/ --include='*.py'"

# =============================================================================
# CROSS-CUTTING CONCERNS
# =============================================================================

cross_cutting:
  
  all_rules_must:
    - fail_fast_not_silent
    - provide_clear_error_messages
    - be_testable
    - be_documentable
    - support_incremental_adoption
  
  overlaps_eliminated:
    error_handling:
      combines: [fail_fast, no_silent_fallbacks, error_governance]
    code_quality:
      combines: [magic_numbers, hardcoding, naming, complexity]
    testing:
      combines: [no_weak_tests, tdd_governance]
    architecture:
      combines: [kiss, yagni, solid_principles]
    fdp:
      enhances: [yagni, fail_fast, clean_table, kiss]
      adds: [query_before_claim, precision_over_approximation, verifiable_decisions]
  
  priority:
    p0_blockers: [clean_table, fail_fast, no_silent_fallbacks, yagni, kiss]
    p1_errors: [type_checking, no_weak_tests, import_governance, module_import_purity]
    p2_warnings: [complexity_limits, documentation, logging, solid_principles, fdp_principles]

# =============================================================================
# AI REASONING & DECISION-MAKING GOVERNANCE
# =============================================================================

reasoning_governance:
  description: "Structured Chain-of-Thought validation for AI-assisted development"
  note: "Can be extended with project-specific reasoning schema if needed"
  version: "2.1.0"
  
  semantic_types:
    required_structure:
      assumption:
        must_have: [id, statement, confidence, impact_if_wrong]
        id_pattern: "^assumption_[a-z0-9_]+$"
        min_statement_length: 10
        min_impact_length: 20
      
      claim:
        must_have: [id, statement, evidence_ids, confidence]
        id_pattern: "^claim_[a-z0-9_]+$"
        min_evidence_count: 1
        requirement_level: MUST
      
      fact:
        must_have: [id, statement, source_id, verification_status]
        id_pattern: "^fact_[a-z0-9_]+$"
        allowed_verification: [verified, unverified, disputed]
        requirement_level: MUST
      
      decision:
        must_have: [id, chosen_option, rationale_id, alternatives_considered]
        id_pattern: "^decision_[a-z0-9_]+$"
        min_alternatives: 1
        must_assess_reversibility: SHOULD
        requirement_level: MUST
      
      evidence:
        must_have: [id, type, content, supports_claim_ids]
        id_pattern: "^evidence_[a-z0-9_]+$"
        allowed_types: [observation, measurement, citation, test_result, simulation]
        requirement_level: MUST
  
  evidence_requirements:
    by_task_complexity:
      simple:
        min_sources: 1
        requirement_level: MUST
      
      medium:
        min_sources: 2
        min_alternatives: 1
        requirement_level: MUST
      
      complex:
        min_sources: 3
        min_alternatives: 2
        risk_assessment: MUST
        requirement_level: MUST
  
  claim_validation:
    fact_vs_assumption:
      rule: "Facts MUST have source_id; Assumptions MUST NOT"
      requirement_level: MUST
    
    evidence_linkage:
      rule: "Claims MUST reference evidence_ids"
      requirement_level: MUST
    
    confidence_assessment:
      rule: "Claims SHOULD include confidence level"
      requirement_level: SHOULD
      allowed_levels: [high, medium, low]
  
  decision_validation:
    alternatives:
      rule: "Decisions MUST consider alternatives"
      min_alternatives: 1
      requirement_level: MUST
    
    rationale:
      rule: "Decisions MUST have rationale_id"
      requirement_level: MUST
    
    reversibility:
      rule: "Decisions SHOULD assess reversibility"
      requirement_level: SHOULD
  
  risk_assessment:
    critical_impact:
      rule: "Critical risks MUST have mitigation"
      requirement_level: MUST
    
    likelihood_impact:
      rule: "Risks MUST specify both likelihood and impact"
      requirement_level: MUST
  
  prohibited_patterns:
    circular_reasoning:
      rule: "Evidence MUST_NOT reference claims it supports"
      requirement_level: MUST_NOT
      severity: ERROR
    
    unanchored_claims:
      rule: "Claims MUST_NOT exist without evidence"
      requirement_level: MUST_NOT
      severity: ERROR
    
    unsourced_facts:
      rule: "Facts MUST_NOT exist without source_id"
      requirement_level: MUST_NOT
      severity: ERROR
    
    assumption_as_fact:
      rule: "Assumptions MUST_NOT be presented as facts"
      requirement_level: MUST_NOT
      severity: ERROR
  
  optional_enhancements:
    pattern_recognition:
      rule: "MAY identify recurring patterns in reasoning"
      requirement_level: MAY
    
    validation_tests:
      rule: "Complex tasks SHOULD include validation elements"
      requirement_level: SHOULD
  
  integration_with_code_governance:
    facts_before_files:
      relation: "FACTS.parquet = verified facts with source_id"
      reasoning: "Query facts (verified) before assumptions (unverified)"
    
    clean_table:
      relation: "No unverified assumptions in delivered work"
      reasoning: "Assumptions must be validated or documented as risks"
    
    no_silent_fallbacks:
      relation: "Unanchored claims = silent failures in reasoning"
      reasoning: "Claims without evidence are reasoning errors"
    
    tdd_governance:
      relation: "Tests are evidence for code behavior claims"
      reasoning: "Test results validate or refute implementation claims"
    
    fdp_principles:
      relation: "FDP provides methodology for fact collection"
      reasoning: "Evidence blocks = structured fact gathering for decisions"
