      - no_probabilistic_without_evidence: "Enforced via automated checks"
      - measure_impact: "Blast radius, complexity, coupling"
      - document_alternatives: "What was considered and why rejected"
    adoption_steps:
      - pre_commit_checks: "Automated grep for probabilistic language"
      - decision_templates: "Use verifiable decision template"
