# VERSION HISTORY
# ============================================================================

version_history:
  v1_0_0:
    date: "2025-12-27"
    changes:
      - "Initial version"
      - "Defined discovery workflow (check → read → use)"
      - "Specified file formats (START_HERE.md, AI_INDEX.json)"
      - "Added package distribution instructions"
      - "Included error handling and fallbacks"
