# =============================================================================
# VALIDATION CHECKLIST
# =============================================================================

validation_checklist:
  for_agent_developers:
    - check: "Agent includes 'Output Metadata (TOCTOU Protection)' section in .md file"
      location: ".claude/agents/<agent-name>.md"

    - check: "Agent documents all 6 metadata fields"
      required: ["facts_file", "facts_mtime", "commit_sha", "generator_version", "file_count", "query_timestamp"]

    - check: "Agent provides JSON output with .metadata top-level key"
      command: "uv run fact-file-query-tool <agent> --format json"

    - check: "Agent references FDP_AI_WORKFLOW.md §2.6"
      purpose: "Link to full context hygiene guidance"

  for_orchestrators:
    - check: "Extract metadata.facts_file from agent output"
      fail_if: "Field missing or not accessible"

    - check: "Get current FACTS file (readlink FACTS.parquet)"
      fail_if: "FACTS.parquet doesn't exist or not a symlink"

    - check: "Verify agent_facts == current_facts"
      fail_if: "Mismatch - results are stale"

    - check: "Only use results after successful verification"
      fail_if: "Using results before or without verification"

  for_evidence_blocks:
    - check: "Include metadata section from agent output"
      required_fields: ["facts_file", "commit_sha", "query_timestamp"]

    - check: "Reference FDP_AI_WORKFLOW.md §2.6 in evidence block"
      purpose: "Document verification was performed"

